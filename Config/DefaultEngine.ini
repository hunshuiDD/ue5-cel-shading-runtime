; 关闭 Lumen 硬件光追，改走软件追踪（SDF）。角色是骨骼网格且每帧动画，硬件光追必须每帧重建 BVH，
; 这笔开销压在渲染线程上；本项目是渲染线程 bound、GPU 常有余量，所以这笔 CPU→GPU 的成本转移是纯赚。
; 实测（独立进程/1400x788/PerShadow 开）：Frame 19.88→14.49ms，-5.39ms / -27%，56→69 FPS，GI 完整保留。
; 视觉代价仅反射精度，本项目金属件走 matcap 不吃反射，已确认无可见影响。详见 系统改进清单 §9 / Scorecard §9。
