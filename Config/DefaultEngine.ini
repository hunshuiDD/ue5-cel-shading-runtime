; Shader 开发调试。错误改从 Output Log 看（非模态），不再每个排列弹“是否重试”对话框。
; ShaderDevelopmentMode=1 会对每个失败排列弹模态框，坏材质时会刷屏，故设 0。
; 报错行号仍可用：DumpShaderDebugInfo 落盘生成 shader，Output Log 也会打出 .ush 行号。
r.ShaderDevelopmentMode=0
r.DumpShaderDebugInfo=1
r.Shaders.KeepDebugInfo=1

[/Script/RenderDocPlugin.RenderDocPluginSettings]
; 2026-08-22 排查完毕，已改回 True。
;
; ⚠ 要用 -d3ddebug 看 D3D12 验证层消息时，必须先把这里改成 False。
; AutoAttach=True 会在启动时无条件加载 renderdoc.dll（不需要手动挂），而 RenderDoc 会把
; ID3D12InfoQueue / ID3D12InfoQueue1 换成 dummy 实现（renderdoc d3d12_device.cpp:1404/1413），
; 导致 UE 的 ID3D12InfoQueue1::RegisterMessageCallback 失败，验证消息一条都进不了日志。
; 识别特征：同一份日志里同时出现 `-D3DDebug = on` 和 `RegisterMessageCallback failed`。
; 2026-08-22 因为这个坑白跑了三轮 -d3ddebug，改成 False 后一次就拿到了报错原文。
renderdoc.AutoAttach=True
renderdoc.ShowHelpOnStartup=False
; renderdoc.BinaryPath=<本机 RenderDoc 安装路径>

